<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9cbb8"/>
      <stop offset="0.35" stop-color="#a99482"/>
      <stop offset="0.7" stop-color="#6f6470"/>
      <stop offset="1" stop-color="#3f3b4a"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f3e8da"/>
      <stop offset="0.45" stop-color="#c7b39f"/>
      <stop offset="1" stop-color="#7d7180"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#57506a"/>
      <stop offset="0.5" stop-color="#8f8296"/>
      <stop offset="1" stop-color="#e2d6c8"/>
    </linearGradient>
    <linearGradient id="ribbonC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sheen" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="420" cy="180" rx="620" ry="320" fill="#f4eadf" opacity="0.55" filter="url(#softer)"/>
  <ellipse cx="1300" cy="820" rx="560" ry="300" fill="#2f2b3c" opacity="0.6" filter="url(#softer)"/>

  <path d="M-80 1000 C 180 760, 260 420, 520 300 S 980 160, 1180 -60 L 1460 -60 C 1240 180, 1060 330, 760 430 S 360 760, 240 1060 Z" fill="url(#ribbonA)" opacity="0.92" filter="url(#soft)"/>
  <path d="M 300 1060 C 520 820, 760 640, 1040 560 S 1460 420, 1680 160 L 1680 520 C 1500 640, 1300 700, 1120 760 S 760 920, 640 1060 Z" fill="url(#ribbonB)" opacity="0.85" filter="url(#soft)"/>
  <path d="M 900 1060 C 1040 900, 1220 800, 1380 760 S 1600 700, 1700 620 L 1700 1060 Z" fill="#3a3547" opacity="0.7" filter="url(#soft)"/>

  <g fill="none" stroke-linecap="round" filter="url(#sheen)">
    <path d="M-60 980 C 190 750, 270 430, 530 312 S 990 170, 1190 -50" stroke="#fffaf2" stroke-width="5" opacity="0.85"/>
    <path d="M-40 1010 C 200 790, 290 470, 560 350 S 1010 210, 1230 -40" stroke="#fffaf2" stroke-width="2" opacity="0.5"/>
    <path d="M 310 1050 C 530 812, 770 632, 1048 552 S 1468 412, 1690 150" stroke="#fff6ec" stroke-width="4" opacity="0.7"/>
    <path d="M 920 1050 C 1056 894, 1230 792, 1386 752 S 1604 692, 1710 612" stroke="#f1e6ff" stroke-width="3" opacity="0.45"/>
    <path d="M 640 1060 C 760 920, 1120 760, 1300 700" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  </g>

  <path d="M-80 1000 C 180 760, 260 420, 520 300 S 980 160, 1180 -60 L 1250 -60 C 1040 180, 900 260, 640 350 S 300 700, 160 1040 Z" fill="url(#ribbonC)" opacity="0.35" filter="url(#soft)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
